kind = "web"
previewPath = "/"
title = "Synovance Ventures"
version = "1.0.0"
id = "artifacts/synovance"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24911

[services.development]
run = "pnpm --filter @workspace/synovance run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/synovance", "run", "build" ]
publicDir = "artifacts/synovance/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24911"
BASE_PATH = "/"
